argument_specs:
  main:
    short_description: Foo role
    version_added: 0.2.0
    description:
      - This is the foo role.
      - If you set O(foo_param_1) while O(foo_param_2=3), this might behave funny.
    author:
      - Felix Fontein (@felixfontein)
    options:
      foo_param_1:
        type: str
        description:
          - A string parameter
          - If you set O(foo_param_1) while O(foo_param_2=3), this might behave funny.
      foo_param_2:
        type: int
        description: An integer parameter with a default.
        default: 13
    return:
      foo_reboot_required:
        description:
          - V(true) means the host must reboot to apply the role's changes.
          - The role sets this when O(foo_param_2) is at least 2 and it made
            changes.
        type: bool
        returned: always
        sample: true
      foo_facts:
        description:
          - Information gathered by the role about the foo configuration.
          - The role uses this to decide whether to set RV(foo_reboot_required).
        type: list
        elements: dict
        returned: When O(foo_param_1) is set.
        contains:
          name:
            description: The name of the entry.
            type: str
          value:
            description: The value of the entry.
            type: str
          default:
            description: Whether this is the default entry.
            type: bool
        sample:
          - name: example
            value: foobar
            default: true
    attributes:
      check_mode:
        description: Can run in check_mode and return changed status prediction without modifying target
        support: full
      platform:
        description: The supported platforms
        platforms: Linux, macOS, FreeBSD
        support: full
    seealso:
      - module: ns2.col.foo
    deprecated:
        removed_at_date: 2020-01-01
        why: |
          Just some text.
          This one has more than one line.
          And one more.
        alternatives: |
          I don't know
          of any
          alternative.
    examples: |-
      - name: Use role
        include_role: ns2.col.foo
        vars:
          foo_param_1: foobar
          foo_param_2: 23
